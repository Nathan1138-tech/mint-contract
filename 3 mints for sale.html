<DOCTYPE html>
<html>
<head>
<p>3 MINTS FOR SLALE!</p>
</head>
<body>
<p>3 mints = $squishy</p>
<p> I make this as proof that we made a deal and I will claim my three 3 sooner or later</p>
<canvas id="signaturePad" width="400" height="200" style="border:1px solid black;"></canvas>
<input id="typedName" type="text" placeholder="Type your name here">
<button id="clearBtn">Erase</button>
<script>
const canvas = document.getElementById("signaturePad");
const ctx = canvas.getContext("2d");

let drawing = false;

canvas.addEventListener("mousedown", () => {
    drawing = true;
});

canvas.addEventListener("mouseup", () => {
    drawing = false;
    ctx.beginPath();
});

canvas.addEventListener("mousemove", (event) => {
    if (!drawing) return;

    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;

    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "black";

    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
});
document.getElementById("clearBtn").addEventListener("click", () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
});
const typedNameInput = document.getElementById("typedName");
</script>
</body>
</html>
